name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run pytest
      - run: uv build
      - name: Build release archives
        shell: pwsh
        run: service/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalMcpGateway
          path: dist/release/*
