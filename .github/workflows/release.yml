name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: uv run pytest
      - run: uv build
      - shell: pwsh
        run: service/package.ps1
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/release/*
