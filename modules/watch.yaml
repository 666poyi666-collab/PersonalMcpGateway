id: watch
display_name: WatchIntervals
enabled: true
adapter_version: 1
priority: 10
execution_mode: http

authentication:
  type: pairing_token
  secret_ref: watch.phone_token

phone:
  service_type: _watchintervals-phone._tcp.local.
  expected_device_id: ""
  fallback_base_url: ""

watch:
  service_type: _watchintervals._tcp.local.
  expected_device_id: ""
  fallback_base_url: ""

timeouts:
  connect_seconds: 3
  read_seconds: 15
  write_seconds: 20

retry:
  max_attempts: 3
  base_delay_ms: 300
